services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire}
      POSTGRES_DB: appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    logging:
      driver: local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GIN_MODE: release
      API_KEY: ${API_KEY:?API_KEY obligatoire}
      DATABASE_URL: "postgres://app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire}@db:5432/appdb?sslmode=disable"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: local
    depends_on:
      db:
        condition: service_healthy

  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire}@db:5432/appdb?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
